# Dev profile: no reverse proxy / ERP available locally.
# The datasource values below are placeholders - override them (e.g. via env vars,
# a local application-dev-local.yml, or -D system properties) to point at your own
# local PostgreSQL instance if these defaults don't match your setup.
spring:
  datasource:
    url: ${HELPDESK_DB_URL:jdbc:postgresql://localhost:5432/fawnix_helpdesk}
    username: ${HELPDESK_DB_USERNAME:postgres}
    password: ${HELPDESK_DB_PASSWORD:postgres}

app:
  notifications:
    # Off locally unless integration- and notifications-service are running too.
    email-enabled: ${HELPDESK_EMAIL_ENABLED:false}

logging:
  level:
    com.erp.ticketing: DEBUG

# Tokens without a "permissions" claim (minted by JwtService) may carry helpdesk role names only where a
# profile says so; production derives roles from identity permissions alone. Revocations are not polled outside a running identity-service.
app.jwt.local-tokens-enabled: true
app.security.revocation.fail-closed: false

# Local-only defaults. These used to sit in application.yml, where production silently inherited
# them; they belong to the dev profile alone. The public key is identity-service's DEV key pair.
app.security.startup-check.enabled: false
app.security.revocation.identity-url: ${IDENTITY_SERVICE_URL:http://localhost:8081}
app.security.jwt.private-key: ${JWT_PRIVATE_KEY:}
app.security.jwt.public-key: ${JWT_PUBLIC_KEY:}
