server:
  # Access tokens carry every permission key plus its scope; an admin's is ~10 KB, over the 8 KB default.
  max-http-request-header-size: ${MAX_HTTP_REQUEST_HEADER_SIZE:64KB}
  port: ${SERVER_PORT:8096}

spring:
  application:
    name: helpdesk-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  security:
    # Shared secret for service-to-service calls (sent to integration-service for email).
    internal-service-secret: ${INTERNAL_SERVICE_SECRET:fawnix-internal-secret}
    jwt:
      # RS256 public key from identity-service - the same default every other
      # service and the gateway verify with. identity tokens are the only ones
      # the web app sends; see IdentityTokenVerifier.
      public-key: ${JWT_PUBLIC_KEY:}
  jwt:
    # The service's own HS256 tokens (JwtService) - only the integration tests
    # mint these now. 8 hours. app.jwt.secret has no default here - each profile
    # (dev/test/prod) must supply its own signing key.
    expiration-ms: 28800000
  attachments:
    storage-dir: ${HELPDESK_ATTACHMENTS_DIR:./data/attachments}
  sla:
    monitoring:
      enabled: true
      fixed-delay-ms: 60000
  notifications:
    # Ticket emails go helpdesk -> integration-service -> notifications-service -> SMTP.
    # SMTP settings live only in notifications-service.
    email-enabled: ${HELPDESK_EMAIL_ENABLED:true}
    integration-url: ${INTEGRATION_SERVICE_URL:http://integration-service}
  # Connection to the separate Asset Manager service (asset-management). Tickets, problems, changes and
  # major incidents reference its assets by id; the lookup searches it and a new ASSET_MANAGER reference
  # must exist there. Inside compose, point ASSET_MANAGER_BASE_URL at http://asset-management:8088.
  asset-manager:
    enabled: ${ASSET_MANAGER_ENABLED:true}
    base-url: ${ASSET_MANAGER_BASE_URL:http://localhost:8088}
    connect-timeout: ${ASSET_MANAGER_CONNECT_TIMEOUT:3s}
    read-timeout: ${ASSET_MANAGER_READ_TIMEOUT:10s}
  # Hand-over of ticket events to the external notification-service (see docs/notification-integration.md).
  # Off until NOTIFICATION_SERVICE_ENABLED=true; the secret must match INTERNAL_SERVICE_SECRET over there.
  notification-service:
    enabled: ${NOTIFICATION_SERVICE_ENABLED:false}
    base-url: ${NOTIFICATION_SERVICE_BASE_URL:http://localhost:8092}
    internal-secret: ${NOTIFICATION_SERVICE_INTERNAL_SECRET:}
    connect-timeout: ${NOTIFICATION_SERVICE_CONNECT_TIMEOUT:3s}
    read-timeout: ${NOTIFICATION_SERVICE_READ_TIMEOUT:15s}
    app-base-url: ${HELPDESK_APP_BASE_URL:http://localhost:5173}
    max-attempts: ${NOTIFICATION_SERVICE_MAX_ATTEMPTS:6}
    retry-base-delay: ${NOTIFICATION_SERVICE_RETRY_BASE_DELAY:30s}
    retry-max-delay: ${NOTIFICATION_SERVICE_RETRY_MAX_DELAY:15m}
    poll-interval-ms: ${NOTIFICATION_SERVICE_POLL_INTERVAL_MS:5000}
