# Integration test profile: runs against the real, dedicated `ticketing_test`
# PostgreSQL database (see task notes - Testcontainers is unavailable in this
# environment, so Flyway migrates this real, otherwise-empty database instead).
# @Transactional integration test classes roll back everything each test
# commits directly, so re-running `mvn test` repeatedly leaves this database
# clean (aside from rows created via REQUIRES_NEW, e.g. UserService's
# find-or-create user lookup, which is idempotent by erpUserId).
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/ticketing_test
    username: ${HELPDESK_TEST_DB_USERNAME:postgres}
    password: ${HELPDESK_TEST_DB_PASSWORD:postgres}
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate

app:
  sla:
    monitoring:
      enabled: false
  approvals:
    timeout-job:
      enabled: false
  notifications:
    email-enabled: false
  # No Asset Manager runs alongside the tests; AssetManagerClientTest covers that contract with a mock server.
  asset-manager:
    enabled: false

logging:
  level:
    com.erp.ticketing: INFO

eureka:
  client:
    enabled: false

# Tokens without a "permissions" claim (minted by JwtService) may carry helpdesk role names only where a
# profile says so; production derives roles from identity permissions alone. Revocations are not polled outside a running identity-service.
app.jwt.local-tokens-enabled: true
app.security.revocation.fail-closed: false
# Tests mint local tokens and run without identity-service, so the production startup check is off.
app.security.startup-check.enabled: false
# identity-service's DEV RS256 key pair (see identity-service application-local.yml): the tests mint
# tokens with the private key and the filter verifies them with the public key, as in every service.
app.security.jwt.private-key: ${JWT_PRIVATE_KEY:}
app.security.jwt.public-key: ${JWT_PUBLIC_KEY:}
